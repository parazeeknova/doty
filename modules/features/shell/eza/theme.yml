    foreground: "#c4cb97"
  git_clean:
    foreground: "#ffb77b"
  git_dirty:
    foreground: "#c4cb97"

security_context:
  none:
    foreground: "#d6c3b6"
  selinux:
    colon:
      foreground: "#d6c3b6"
    user:
      foreground: "#e3c0a5"
    role:
      foreground: "#c4cb97"
    typ:
      foreground: "#ffb77b"
