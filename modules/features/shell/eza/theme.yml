git:
  new:
    foreground: "#ffb77b"
  modified:
    foreground: "#c4cb97"
  deleted:
    foreground: "#ffb4ab"
  renamed:
    foreground: "#e3c0a5"
  ignored:
    foreground: "#d6c3b6"
