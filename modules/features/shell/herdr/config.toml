# Herdr configuration - auto-generated from wallpaper colors by wabi theme_switcher
# Do not edit config.toml directly — edit config.toml.template instead.

onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
sidebar_bg = "#221f17"
active_row_bg = "#4b4739"
selection_bg = "#4b4739"
surface_dim = "#221f17"
panel_bg = "#16130b"
accent = "#dcc66e"
blue = "#dcc66e"
mauve = "#dcc66e"
red = "#ffb4ab"
green = "#dcc66e"
yellow = "#aad0b2"
peach = "#d2c6a1"

[ui]
accent = "#dcc66e"
pane_gaps = false
pane_borders = false
pane_outer_borders = false
status_indicators = "symbols"

[terminal]
new_cwd = "follow"
shell_mode = "auto"

[keys]
prefix = "ctrl+b"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "pet.toggle"
description = "Toggle Pet"

[[keys.command]]
key = "prefix+P"
type = "plugin_action"
command = "pet.settings"
description = "Pet Settings"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "top-right"

[experimental]
kitty_graphics = true
