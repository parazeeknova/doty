# Herdr configuration - auto-generated from wallpaper colors by wabi theme_switcher
# Do not edit config.toml directly — edit config.toml.template instead.

onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
sidebar_bg = "#261e18"
active_row_bg = "#51443b"
selection_bg = "#51443b"
surface_dim = "#261e18"
panel_bg = "#19120c"
accent = "#ffb77b"
blue = "#ffb77b"
mauve = "#ffb77b"
red = "#ffb4ab"
green = "#ffb77b"
yellow = "#c4cb97"
peach = "#e3c0a5"

[ui]
accent = "#ffb77b"
pane_gaps = false
pane_borders = false
pane_outer_borders = false
status_indicators = "symbols"

[terminal]
new_cwd = "follow"
shell_mode = "auto"

[keys]
prefix = "ctrl+b"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "pet.toggle"
description = "Toggle Pet"

[[keys.command]]
key = "prefix+P"
type = "plugin_action"
command = "pet.settings"
description = "Pet Settings"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "top-right"

[experimental]
kitty_graphics = true
