# Herdr configuration - auto-generated from wallpaper colors by wabi theme_switcher
# Do not edit config.toml directly — edit config.toml.template instead.

onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
sidebar_bg = "#241f17"
active_row_bg = "#4d4639"
selection_bg = "#4d4639"
surface_dim = "#241f17"
panel_bg = "#17130b"
accent = "#ebc16c"
blue = "#ebc16c"
mauve = "#ebc16c"
red = "#ffb4ab"
green = "#ebc16c"
yellow = "#b2cfa8"
peach = "#d9c4a0"

[ui]
accent = "#ebc16c"
pane_gaps = false
pane_borders = false
pane_outer_borders = false
status_indicators = "symbols"

[terminal]
new_cwd = "follow"
shell_mode = "auto"

[keys]
prefix = "ctrl+b"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "pet.toggle"
description = "Toggle Pet"

[[keys.command]]
key = "prefix+P"
type = "plugin_action"
command = "pet.settings"
description = "Pet Settings"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "top-right"

[experimental]
kitty_graphics = true
