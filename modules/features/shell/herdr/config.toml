# Herdr configuration - auto-generated from wallpaper colors by wabi theme_switcher
# Do not edit config.toml directly — edit config.toml.template instead.

onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
sidebar_bg = "#261e18"
active_row_bg = "#50453a"
selection_bg = "#50453a"
surface_dim = "#261e18"
panel_bg = "#19120c"
accent = "#fcb974"
blue = "#fcb974"
mauve = "#fcb974"
red = "#ffb4ab"
green = "#fcb974"
yellow = "#bfcc9a"
peach = "#e1c1a4"

[ui]
accent = "#fcb974"
pane_gaps = false
pane_borders = false
pane_outer_borders = false
status_indicators = "symbols"

[terminal]
new_cwd = "follow"
shell_mode = "auto"

[keys]
prefix = "ctrl+b"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "allmight-ai.herdr-pet.open"
description = "Toggle Herdr Pet"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "top-right"

[experimental]
kitty_graphics = true
