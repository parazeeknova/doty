# Herdr configuration - auto-generated from wallpaper colors by wabi theme_switcher
# Do not edit config.toml directly — edit config.toml.template instead.

onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
sidebar_bg = "#251f17"
active_row_bg = "#4f4539"
selection_bg = "#4f4539"
surface_dim = "#251f17"
panel_bg = "#18120b"
accent = "#f6bc70"
blue = "#f6bc70"
mauve = "#f6bc70"
red = "#ffb4ab"
green = "#f6bc70"
yellow = "#b9cda0"
peach = "#dec2a2"

[ui]
accent = "#f6bc70"
pane_gaps = false
pane_borders = false
pane_outer_borders = false
status_indicators = "symbols"

[terminal]
new_cwd = "follow"
shell_mode = "auto"

[keys]
prefix = "ctrl+b"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "pet.toggle"
description = "Toggle Pet"

[[keys.command]]
key = "prefix+P"
type = "plugin_action"
command = "pet.settings"
description = "Pet Settings"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "top-right"

[experimental]
kitty_graphics = true
