model = "gpt-5.6-terra"
model_reasoning_effort = "high"

[notice]
hide_rate_limit_model_nudge = true

[features]
hooks = true

[projects."/home/parazeeknova/Repository/sw/singularityworks"]
trust_level = "trusted"

[projects."/home/parazeeknova/Projects/verso"]
trust_level = "trusted"

[projects."/home/parazeeknova/Projects/ho"]
trust_level = "trusted"

[tui.model_availability_nux]
"gpt-5.5" = 2
"gpt-5.6-sol" = 2

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
http_headers = { CONTEXT7_API_KEY = "$CONTEXT7_API_KEY" }

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "$GITHUB_PERSONAL_ACCESS_TOKEN" }

[mcp_servers.filesystem]
command = "npx"
args = [
  "-y",
  "@modelcontextprotocol/server-filesystem",
  "/home/parazeeknova/doty",
  "/home/parazeeknova/Repository",
  "/home/parazeeknova/Projects",
  "/home/parazeeknova",
]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--autoConnect"]

[mcp_servers.firecrawl]
command = "bunx"
args = ["firecrawl-mcp"]
env = { FIRECRAWL_API_URL = "http://127.0.0.1:48002" }

[mcp_servers.hindsight]
url = "http://127.0.0.1:48888/mcp/default"

[mcp_servers.camofox]
command = "npx"
args = ["-y", "camofox-mcp@latest"]
env = { CAMOFOX_URL = "http://127.0.0.1:49377" }
