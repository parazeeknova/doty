#:schema https://yazi-rs.github.io/schemas/theme.json
# Rendered by wabi theme_switcher from matugen colors.
# Do not edit theme.toml directly — edit theme.toml.template instead.

[flavor]
dark  = ""
light = ""

[mgr]
cwd = { fg = "#ffb77b" }

find_keyword  = { fg = "#c4cb97", bold = true, italic = true, underline = true }
find_position = { fg = "#e3c0a5", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "#d6c3b6", italic = true }

marker_copied   = { fg = "#ffb77b",    bg = "#ffb77b" }
marker_cut      = { fg = "#ffb4ab",     bg = "#ffb4ab" }
marker_marked   = { fg = "#e3c0a5", bg = "#e3c0a5" }
marker_selected = { fg = "#c4cb97",  bg = "#c4cb97" }
marker_symbol   = "│"

count_copied   = { fg = "#19120c", bg = "#ffb77b" }
count_cut      = { fg = "#19120c", bg = "#ffb4ab" }
count_selected = { fg = "#19120c", bg = "#c4cb97" }

border_symbol = "│"
border_style  = { fg = "#51443b" }

syntect_theme = ""

[tabs]
active   = { fg = "#19120c",       bg = "#ffb77b",  bold = true }
inactive = { fg = "#d6c3b6", bg = "#261e18" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#19120c",       bg = "#ffb77b",  bold = true }
normal_alt  = { fg = "#ffb77b",   bg = "#261e18" }

select_main = { fg = "#19120c",       bg = "#c4cb97", bold = true }
select_alt  = { fg = "#c4cb97", bg = "#261e18" }

unset_main  = { fg = "#19120c",       bg = "#ffb4ab",    bold = true }
unset_alt   = { fg = "#ffb4ab",    bg = "#261e18" }

[indicator]
parent  = { fg = "#ffb77b",    reversed = true }
current = { fg = "#ffb77b",    reversed = true }
preview = { fg = "#e3c0a5", underline = true }
padding = { open = "", close = "" }

[status]
overall   = { bg = "#261e18" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#51443b" }
perm_type  = { fg = "#ffb77b" }
perm_read  = { fg = "#c4cb97" }
perm_write = { fg = "#ffb4ab" }
perm_exec  = { fg = "#e3c0a5" }

progress_label  = { fg = "#efe0d6",     bold = true }
progress_normal = { fg = "#ffb77b", bg = "#51443b" }
progress_error  = { fg = "#ffb4ab",  bg = "#51443b" }

[which]
cols            = 3
mask            = { bg = "#261e18" }
cand            = { fg = "#ffb77b" }
rest            = { fg = "#d6c3b6" }
desc            = { fg = "#e3c0a5" }
separator       = "  "
separator_style = { fg = "#51443b" }

[confirm]
border     = { fg = "#ffb77b" }
title      = { fg = "#ffb77b" }
body       = { fg = "#efe0d6" }
list       = {}
btn_yes    = { fg = "#19120c", bg = "#ffb77b", bold = true }
btn_no     = { fg = "#d6c3b6" }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#ffb77b" }
title  = { fg = "#ffb77b" }

tbl_col  = { fg = "#ffb77b" }
tbl_cell = { fg = "#c4cb97", reversed = true }

[notify]
title_info  = { fg = "#ffb77b" }
title_warn  = { fg = "#c4cb97" }
title_error = { fg = "#ffb4ab" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[pick]
border   = { fg = "#ffb77b" }
active   = { fg = "#e3c0a5", bold = true }
inactive = { fg = "#d6c3b6" }

[input]
border   = { fg = "#ffb77b" }
title    = { fg = "#efe0d6" }
value    = { fg = "#efe0d6" }
selected = { fg = "#19120c", bg = "#ffb77b" }

[cmp]
border   = { fg = "#ffb77b" }
active   = { fg = "#19120c", bg = "#ffb77b" }
inactive = { fg = "#d6c3b6" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#ffb77b" }
title   = { fg = "#efe0d6" }
hovered = { fg = "#e3c0a5", bold = true }

[help]
on      = { fg = "#e3c0a5" }
run     = { fg = "#ffb77b" }
desc    = { fg = "#efe0d6" }
hovered = { fg = "#19120c", bg = "#ffb77b", bold = true }
footer  = { fg = "#19120c", bg = "#ffb77b" }

[filetype]
rules = [
	{ mime = "image/*",                                                                                                                fg = "#c4cb97" },
	{ mime = "{audio,video}/*",                                                                                                        fg = "#e3c0a5" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}",                            fg = "#ffb4ab" },
	{ mime = "application/{pdf,doc,rtf}",                                                                                              fg = "#e3c0a5" },
	{ mime = "vfs/{absent,stale}",                                                                                                     fg = "#51443b" },
	{ url = "*", is = "orphan",                                                                                                        bg = "#ffb4ab" },
	{ url = "*", is = "exec",                                                                                                          fg = "#ffb77b" },
	{ url = "*", is = "dummy",                                                                                                         bg = "#ffb4ab" },
	{ url = "*/", is = "dummy",                                                                                                        bg = "#ffb4ab" },
	{ url = "*/",                                                                                                                      fg = "#ffb77b" },
]
