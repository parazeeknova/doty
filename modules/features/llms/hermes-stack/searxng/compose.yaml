name: hermes-searxng

# Self-hosted SearXNG for the Hermes local stack (web search backend).
# - Host port 48080 (container 8080)
# - JSON format enabled (hermes queries /search?format=json)
# - Uses local Google-compatible engines; no API keys.

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: hermes-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:48081:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:48080/
      # Secret used to sign session cookies — generate at runtime if unset.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    # SearXNG is lightweight; keep it bounded.
    cpus: 1.0
    mem_limit: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
