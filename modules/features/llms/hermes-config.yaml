model:
  default: stealth/ox-alpha
  provider: nous
  base_url: https://inference-api.nousresearch.com/v1
agent:
  reasoning_effort: high
terminal:
  backend: local
  font_family: FiraCode Nerd Font
web:
  backend: firecrawl
  search_backend: searxng
  extract_backend: firecrawl
  use_gateway: false
browser:
  cloud_provider: camofox
  use_gateway: false
display:
  personality: none
  skin: sisyphus
  pet:
    enabled: false
    slug: makisekurisu
    scale: 0.55
dashboard:
  theme: mono
  font: jetbrains-mono
tts:
  provider: edge
  edge:
    voice: en-US-GuyNeural
stt:
  enabled: true
  language: en
  provider: local
voice:
  auto_tts: false
wake_word:
  enabled: true
  provider: openwakeword
  phrase: hey hermes
memory:
  provider: hindsight
timezone: Asia/Kolkata
approvals:
  destructive_slash_confirm: false
sessions:
  auto_archive: true
  auto_archive_days: 7
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
proxy:
  enabled: false
_config_version: 33
